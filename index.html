<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Viral Post Hook Generator</title>
    
    <!-- Vercel Analytics Script -->
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 500px; margin: auto; background-color: #0f172a; color: #f8fafc; }
        h2 { color: #38bdf8; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        #result { margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; color: #e2e8f0; }
        .coffee-btn { display: block; text-align: center; margin-top: 25px; color: #fbbf24; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🚀 AI Viral Hook Generator</h2>
    <p>Write your post topic below:</p>

    <textarea id="userInput" placeholder="e.g. How I built a micro AI tool in 24 hours..."></textarea>
    <button onclick="generateHook()">Generate Hooks</button>

    <div id="result">Your AI hooks will appear here...</div>

    <a class="coffee-btn" href="https://buymeacoffee.com" target="_blank">☕ Buy me a coffee ($3)</a>

    <script>
        async function generateHook() {
            const text = document.getElementById('userInput').value;
            const resultDiv = document.getElementById('result');
            if (!text) return alert('Enter topic first!');

            resultDiv.innerText = 'Generating with AI... ⏳';

            setTimeout(() => {
                resultDiv.innerText = `🔥 Hook 1: Most people fail at "${text}" because of one simple mistake...\n\n🧵 Hook 2: I spent 10+ hours testing "${text}". Here is what actually works:\n\n⚡ Hook 3: Want to master "${text}" in record time? Read this:`;
            }, 1000);
        }
    </script>
</body>
</html>
