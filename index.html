<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hooks Generator – Free Social Media & Content Tool</title>

    <!-- Vercel Analytics Script -->
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 16px; 
            line-height: 1.5; 
            max-width: 520px; 
            margin: auto; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        h2 { color: #38bdf8; text-align: center; font-size: 22px; margin-bottom: 6px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        
        label { font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-top: 14px; margin-bottom: 6px; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background-color: #1e293b; 
            color: #fff; 
            font-size: 14px; 
        }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }

        /* Quick Idea Chips Styles */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        
        .btn-primary { 
            width: 100%; 
            padding: 13px; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: 700; 
            border: none; 
            border-radius: 8px; 
            margin-top: 18px; 
            cursor: pointer; 
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-primary:disabled { background: #64748b; cursor: not-allowed; }
        
        .result-container { 
            position: relative; 
            margin-top: 22px; 
            display: none; 
        }
        #result { 
            padding: 16px; 
            background: #1e293b; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            white-space: pre-line; 
            font-size: 14px;
            color: #e2e8f0;
            min-height: 100px;
        }
        
        /* Professional Action Buttons Grid */
        .action-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 6px;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }
        .btn-secondary:hover { 
            background: #334155; 
            border-color: #475569;
            color: #ffffff;
        }
        .btn-secondary svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* History Section Styles */
        .history-section {
            margin-top: 30px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            display: none;
        }
        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .history-item {
            font-size: 12px;
            color: #94a3b8;
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #1e293b;
            font-size: 13px;
            color: #94a3b8;
        }
        footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h2>⚡ AI Hooks Generator</h2>
    <p class="subtitle">Create viral hooks for your tweets, reels & posts in seconds.</p>

    <label for="topic">What is your content about?</label>
    <input type="text" id="topic" placeholder="e.g. How I built my first web app">
    
    <!-- Quick Idea Chips -->
    <div class="chips-container">
        <span class="chip" onclick="setTopic('Startup & Micro-SaaS')">Startup</span>
        <span class="chip" onclick="setTopic('Coding & Web Dev')">Coding</span>
        <span class="chip" onclick="setTopic('Fitness & Gym')">Fitness</span>
        <span class="chip" onclick="setTopic('Marketing & Growth')">Marketing</span>
    </div>

    <label for="tone" style="margin-top: 16px;">Select Tone / Style:</label>
    <select id="tone">
        <option value="Viral">Viral & Catchy</option>
        <option value="Professional">Professional & Authoritative</option>
        <option value="Casual">Casual & Friendly</option>
        <option value="Curiosity">Curiosity & Intrigue</option>
    </select>

    <button id="generateBtn" class="btn-primary" onclick="generateHooks()">Generate Hooks</button>

    <div class="result-container" id="resultContainer">
        <div id="result"></div>
        <div class="action-row">
            <!-- Sleek SVG Copy Icon -->
            <button id="copyBtn" class="btn-secondary" onclick="copyToClipboard()">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span id="copyText">Copy</span>
            </button>

            <!-- Sleek SVG Refresh Icon -->
            <button class="btn-secondary" onclick="generateHooks()">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span>Try Another</span>
            </button>

            <!-- Sleek SVG X / Twitter Logo -->
            <a id="shareTwitter" class="btn-secondary" href="#" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span>Post on X</span>
            </a>
        </div>
    </div>

    <!-- Past History Drawer -->
    <div class="history-section" id="historySection">
        <div class="history-title">Recent History</div>
        <div id="historyList"></div>
    </div>

    <footer>
        Check out my other tool: <br>
        <a href="https://ai-email-subject-generator-self.vercel.app/" target="_blank">AI Cold Email Subject Line Generator 📧</a>
    </footer>

    <script>
        window.onload = function() {
            renderHistory();
        };

        function setTopic(val) {
            document.getElementById('topic').value = val;
        }

        function generateHooks() {
            const topic = document.getElementById('topic').value.trim();
            const tone = document.getElementById('tone').value;
            const resultContainer = document.getElementById('resultContainer');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');

            if (!topic) {
                alert("Please enter a topic first!");
                return;
            }

            btn.innerText = "Generating...";
            btn.disabled = true;

            setTimeout(() => {
                let hooks = "";
                if (tone === "Viral") {
                    hooks = `1. Most people fail at ${topic}. Here is the exact blueprint to win:\n\n2. I spent 100+ hours mastering ${topic} so you don't have to:\n\n3. Stop scrolling if you want to finally master ${topic} today:`;
                } else if (tone === "Professional") {
                    hooks = `1. The definitive framework for scaling your results with ${topic}:\n\n2. Three critical insights every professional should know about ${topic}:\n\n3. How top industry leaders approach ${topic} efficiently:`;
                } else if (tone === "Casual") {
                    hooks = `1. Let's talk about ${topic}. Here is what actually worked for me:\n\n2. Unpopular opinion: Getting started with ${topic} is way easier than you think.\n\n3. Ever wondered how to get better at ${topic}? Look at this:`;
                } else {
                    hooks = `1. What if everything you knew about ${topic} was completely wrong?\n\n2. The hidden secret behind ${topic} nobody is talking about:\n\n3. I tested ${topic} for 30 days. Here is what happened:`;
                }

                resultDiv.innerText = hooks;
                resultContainer.style.display = "block";
                
                btn.innerText = "Generate Hooks";
                btn.disabled = false;

                saveToHistory(topic + " (" + tone + ")");

                const tweetText = encodeURIComponent(`Check out these hooks for "${topic}":\n\n${hooks}\n\nGenerated via https://ai-hooks-generator.vercel.app/`);
                document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${tweetText}`;

            }, 600);
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('result').innerText;
            const copyBtn = document.getElementById('copyBtn');
            const copyText = document.getElementById('copyText');

            navigator.clipboard.writeText(textToCopy).then(() => {
                copyText.innerText = "Copied!";
                copyBtn.style.borderColor = "#22c55e";
                copyBtn.style.color = "#22c55e";

                setTimeout(() => {
                    copyText.innerText = "Copy";
                    copyBtn.style.borderColor = "#334155";
                    copyBtn.style.color = "#f8fafc";
                }, 2000);
            });
        }

        function saveToHistory(itemText) {
            let history = JSON.parse(localStorage.getItem('hook_history')) || [];
            history.unshift(itemText);
            if (history.length > 3) history.pop();
            localStorage.setItem('hook_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('hook_history')) || [];
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historySection.style.display = 'none';
                return;
            }

            historySection.style.display = 'block';
            historyList.innerHTML = '';
            history.forEach(item => {
                let div = document.createElement('div');
                div.className = 'history-item';
                div.innerText = item;
                historyList.appendChild(div);
            });
        }
    </script>
</body>
</html>
