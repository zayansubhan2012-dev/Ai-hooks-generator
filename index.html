!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Viral Post Hook Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 500px; margin: auto; }
    h2 { color: #1d9bf0; }
    textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #1d9bf0; color: white; border: none; border-radius: 8px; margin-top: 10px; font-weight: bold; font-size: 16px; }
    #result { margin-top: 20px; padding: 15px; background: #f7f9fa; border-radius: 8px; border: 1px solid #e1e8ed; white-space: pre-wrap; }
    .coffee-btn { display: block; text-align: center; margin-top: 25px; color: #ffdd00; text-decoration: none; font-weight: bold; background: #222; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <h2>🚀 AI Viral Hook Generator</h2>
  <p>Write your post topic below:</p>

  <textarea id="userInput" placeholder="e.g. How I built a micro AI tool in 24 hours..."></textarea>
  <button onclick="generateHook()">Generate Hooks</button>

  <div id="result">Your AI hooks will appear here...</div>

  <a class="coffee-btn" href="https://buymeacoffee.com" target="_blank">☕ Buy me a coffee ($3)</a>

  <script>
    async function generateHook() {
      const text = document.getElementById('userInput').value;
      const resultDiv = document.getElementById('result');
      if (!text) return alert('Enter topic first!');

      resultDiv.innerText = 'Generating with AI... ⏳';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        resultDiv.innerText = data.result || 'Error generating hooks.';
      } catch (err) {
        resultDiv.innerText = 'Failed to fetch response.';
      }
    }
  </script>

</body>
</html>
